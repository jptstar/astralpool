name: Bootstrap AstralPool v1.0 normalization

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run normalization and validation blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/normalize-v1.0-entities.yml').read_text(encoding='utf-8').splitlines()

          def extract(step_name: str) -> str:
              marker = f'      - name: {step_name}'
              start = workflow.index(marker)
              run_line = next(i for i in range(start + 1, len(workflow)) if workflow[i] == '        run: |')
              out = []
              for line in workflow[run_line + 1:]:
                  if line.startswith('      - name: ') or line.startswith('      - uses: '):
                      break
                  out.append(line[10:] if line.startswith('          ') else line)
              return '\n'.join(out) + '\n'

          for name in ('Normalize names and entity IDs', 'Validate syntax, JSON and tests'):
              script = Path('/tmp') / (name.lower().replace(' ', '-') + '.sh')
              script.write_text(extract(name), encoding='utf-8')
              subprocess.run(['bash', str(script)], check=True)
          PY

      - name: Commit normalized stable baseline
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/normalize-v1.0-entities.yml .github/workflows/bootstrap-normalize-v1.yml
          git add -A
          git commit -m "Normalize AstralPool 1.0 entity names and IDs"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Republish v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json body --jq .body > /tmp/release.md
          cat >> /tmp/release.md <<'EOF'

          ## 🧭 Entity naming baseline

          Smart Next and Pro Elyo Touch now share one consistent entity naming scheme. Active alarms use **Alarme · …** and canonical `*_alarm_*` entity IDs, normal binary states use `*_status_*`, and Pro Elyo alarm counters use `*_alarm_count_*`. Existing entity-registry entries are renamed in place while their unique IDs are preserved.
          EOF
          gh release delete v1.0.0 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          gh release create v1.0.0 --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "AstralPool 1.0.0 — Stable baseline" --notes-file /tmp/release.md
