name: Release

on:
  push:
    branches:
      - main
    paths:
      - "custom_components/astralpool/manifest.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("custom_components/astralpool/manifest.json"))["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or intentionally retarget GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$COMMIT_MESSAGE" != *"[retag-release]"* ]]; then
              echo "Release $TAG already exists."
              exit 0
            fi

            echo "Intentionally retargeting $TAG to $GITHUB_SHA"
            git tag -f "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG" --force
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "$TAG"
            exit 0
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
