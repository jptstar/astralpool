name: Publish AstralPool v1.0.1

on:
  push:
    branches:
      - main
    paths:
      - custom_components/astralpool/manifest.json
      - .github/workflows/release-v1.0.1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish v1.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.0.1 already exists"
            exit 0
          fi
          gh release create v1.0.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AstralPool 1.0.1 — Short entity IDs" \
            --notes $'Fix Home Assistant entity ID migration so Smart Next and Pro Elyo Touch use short canonical IDs without area or integration prefixes.\n\nExamples:\n- climate.pro_elyo_touch\n- sensor.pro_elyo_touch_inlet_water_temperature\n- sensor.smart_next_ph\n- number.smart_next_ph_setpoint\n\nExisting unique IDs are preserved.'

      - name: Remove one-time release workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-v1.0.1.yml
          git commit -m "Remove v1.0.1 release workflow"
          git push origin HEAD:main
