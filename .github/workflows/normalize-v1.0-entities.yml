name: Normalize AstralPool v1.0 entities

on:
  push:
    branches:
      - normalize-v1.0-entities

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
