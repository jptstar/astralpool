          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json body --jq .body > /tmp/release.md
          printf '\n\n## 🧭 Entity naming baseline\n\nEntity names and IDs are now normalized across Smart Next and Pro Elyo Touch. Active alarms use the `Alarme · …` naming family and canonical `*_alarm_*` entity IDs, while status entities use `*_status_*`. Pro Elyo alarm counters use `*_alarm_count_*`. Existing registry entries are migrated in place while unique IDs are preserved.\n' >> /tmp/release.md
          gh release delete v1.0.0 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          gh release create v1.0.0 --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "AstralPool 1.0.0 — Stable baseline" --notes-file /tmp/release.md
